<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Editor de App com Plugins e Sugestões</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { background: #0b0b0e; color: #fff; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; height: 100vh; display: flex; flex-direction: column; overflow: hidden; }
    
    header { display: flex; justify-content: space-between; align-items: center; padding: 14px 20px; background: #121216; border-bottom: 1px solid #1f1f26; }
    h2 { font-size: 15px; font-weight: 500; color: #e2e2e9; }
    .actions { display: flex; gap: 8px; }
    button { background: #1a1a20; border: 1px solid #282832; color: #ccc; padding: 8px 16px; border-radius: 8px; font-size: 13px; cursor: pointer; font-weight: 500; transition: 0.15s; }
    button:active { transform: scale(0.96); }
    button.primary { background: #3498db; border-color: #3498db; color: #fff; }

    .container { flex-grow: 1; display: flex; flex-direction: column; padding: 14px; position: relative; }
    
    textarea { 
      flex-grow: 1; 
      background: #08080a; 
      border: 1px solid #1f1f26; 
      border-radius: 12px; 
      color: #e2e2e9; 
      font-family: 'Courier New', Courier, monospace; 
      font-size: 14px; 
      padding: 16px; 
      resize: none; 
      outline: none; 
      line-height: 1.6; 
      tab-size: 2;
    }
    textarea:focus { border-color: #3498db; }

    /* Caixa de Sugestões Flutuante (Até 3 sugestões) */
    .suggestions-box {
      display: none;
      position: absolute;
      background: #16161c;
      border: 1px solid #2a2a35;
      border-radius: 10px;
      box-shadow: 0 8px 24px rgba(0,0,0,0.6);
      width: 220px;
      max-height: 130px;
      overflow-y: auto;
      z-index: 10;
    }
    .suggestion-item {
      padding: 10px 14px;
      font-size: 13px;
      color: #bbb;
      cursor: pointer;
      font-family: monospace;
      border-bottom: 1px solid #1f1f26;
    }
    .suggestion-item:last-child { border-bottom: none; }
    .suggestion-item:hover, .suggestion-item.selected {
      background: #23232c;
      color: #fff;
    }
  </style>
</head>
<body>
  <header>
    <h2 id="editor-title">Editando App</h2>
    <div class="actions">
      <button onclick="window.location.href='index.html'">Voltar</button>
      <button class="primary" onclick="saveCode()">Salvar</button>
    </div>
  </header>

  <div class="container">
    <textarea id="code-box" placeholder="Digite seu código aqui... Use importplugin.lua por exemplo."></textarea>
    <div id="suggestions" class="suggestions-box"></div>
  </div>

  <script>
    const urlParams = new URLSearchParams(window.location.search);
    const appId = parseInt(urlParams.get('id'));

    const apps = JSON.parse(localStorage.getItem('user_apps') || '[]');
    const app = apps.find(a => a.id === appId);

    const codeBox = document.getElementById('code-box');
    const suggestionsBox = document.getElementById('suggestions');

    // Lista de sugestões carregada do TXT ou fallback
    let externalKeywords = ['.log', '.alert', 'document', 'window', 'importplugin', 'TPArch'];

    // Puxa as sugestões do arquivo .TXT
    async function loadSuggestions() {
      try {
        const response = await fetch('sugestoes.txt');
        if (response.ok) {
          const text = await response.text();
          const lines = text.split(/\r?\n/).map(l => l.trim()).filter(l => l.length > 0);
          if (lines.length > 0) {
            externalKeywords = lines;
          }
        }
      } catch (e) {
        console.log('Usando sugestões padrão (sugestoes.txt não encontrado ou inacessível).');
      }
    }
    loadSuggestions();

    if (!app) {
      alert('Aplicativo não encontrado!');
      window.location.href = 'index.html';
    } else {
      document.getElementById('editor-title').innerText = `Editando: ${app.name}`;
      codeBox.value = app.code || '';
    }

    // Sugestões inteligentes (máximo de 3 itens)
    codeBox.addEventListener('input', () => {
      const pos = codeBox.selectionStart;
      const textBeforeCursor = codeBox.value.substring(0, pos);
      const words = textBeforeCursor.split(/[\s\(\)\{\}\+\-\*\/\=\[\]\.]+/);
      const currentWord = words[words.length - 1];

      if (currentWord.length < 2) {
        hideSuggestions();
        return;
      }

      const matches = externalKeywords
        .filter(k => k.toLowerCase().startsWith(currentWord.toLowerCase()))
        .slice(0, 3); // Limita estritamente a 3 possíveis sugestões

      if (matches.length > 0) {
        showSuggestions(matches, currentWord);
      } else {
        hideSuggestions();
      }
    });

    function showSuggestions(matches, query) {
      suggestionsBox.innerHTML = '';
      matches.forEach((match, index) => {
        const div = document.createElement('div');
        div.className = `suggestion-item ${index === 0 ? 'selected' : ''}`;
        div.innerText = match;
        div.onclick = () => applySuggestion(match, query);
        suggestionsBox.appendChild(div);
      });
      suggestionsBox.style.display = 'block';
    }

    function hideSuggestions() {
      suggestionsBox.style.display = 'none';
    }

    function applySuggestion(suggestion, query) {
      const pos = codeBox.selectionStart;
      const val = codeBox.value;
      const completion = suggestion.substring(query.length);
      
      codeBox.value = val.substring(0, pos) + completion + val.substring(pos);
      codeBox.selectionStart = codeBox.selectionEnd = pos + completion.length;
      
      hideSuggestions();
      codeBox.focus();
    }

    // Tecla Enter aceita a sugestão ativa na caixa flutuante
    codeBox.addEventListener('keydown', (e) => {
      if (e.key === 'Enter' && suggestionsBox.style.display === 'block') {
        const selected = suggestionsBox.querySelector('.suggestion-item.selected');
        if (selected) {
          e.preventDefault();
          selected.click();
        }
      }
    });

    // Processa comandos TPArch e importplugin
    function processProcessors(rawCode) {
      let processedCode = rawCode;

      // 1. Processa importplugin (ex: importplugin.lua)
      const pluginRegex = /importplugin\.([a-zA-Z0-9_-]+)/g;
      let pluginMatch;
      while ((pluginMatch = pluginRegex.exec(rawCode)) !== null) {
        const pluginName = pluginMatch[1];
        const pluginApp = apps.find(a => a.name.toLowerCase() === pluginName.toLowerCase());

        if (pluginApp && pluginApp.code) {
          // O plugin pode conter regras de substituição/correção (ex: interpretador/corretor)
          // Aqui executamos o código do plugin de forma segura para varrer e corrigir o código fonte principal
          try {
            // Cria uma função dinâmica onde o plugin processa o código atual
            const correctionFunction = new Function('code', 'print', pluginApp.code + '; return typeof corrigir === "function" ? corrigir(code) : code;');
            
            // Mock básico de função print caso o plugin utilize para mapear correções
            const customPrintMock = (msg) => { console.log("Plugin log:", msg); };
            
            const corrected = correctionFunction(processedCode, customPrintMock);
            if (typeof corrected === 'string') {
              processedCode = corrected;
            }
          } catch (err) {
            console.error("Erro ao executar plugin de correção:", err);
          }
          // Remove a diretiva importplugin da string final se necessário ou mantém
          processedCode = processedCode.replace(pluginMatch[0], '');
        }
      }

      // 2. Processa TPArch tradicional (Injeta código direto)
      const archRegex = /TPArch\s*=\s*['"]([^'"]+)['"]/g;
      let archMatch;
      while ((archMatch = archRegex.exec(rawCode)) !== null) {
        const targetName = archMatch[1];
        const foundApp = apps.find(a => a.name.toLowerCase() === targetName.toLowerCase());
        if (foundApp) {
          processedCode = processedCode.replace(archMatch[0], foundApp.code);
        }
      }

      return processedCode;
    }

    function saveCode() {
      const rawCode = codeBox.value;
      const finalCode = processProcessors(rawCode);

      const appIndex = apps.findIndex(a => a.id === appId);
      if(appIndex !== -1) {
        apps[appIndex].code = finalCode;
        localStorage.setItem('user_apps', JSON.stringify(apps));
        alert('Código processado e salvo com sucesso!');
      } else {
        alert('Erro ao salvar.');
      }
    }
  </script>
</body>
</html>
